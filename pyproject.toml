[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demand-forecasting"
version = "1.0.0"
description = "Retail demand forecasting: back-tested store-product forecasts with LightGBM and the stock decisions they drive"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Mohamed Moin Peer" }]
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.4", "lightgbm>=4.3", "statsmodels>=0.14",
                "holidays>=0.50", "python-dateutil>=2.8", "matplotlib>=3.8", "plotly>=5.20"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
demand-forecasting = "demand_forecasting.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
